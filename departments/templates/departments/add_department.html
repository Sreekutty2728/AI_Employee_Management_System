{% extends 'base.html' %}

{% block title %}Add Department{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-building-add"></i>
                        Add New Department
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Department Name
                            </label>

                            {{ form.department_name }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Department Code
                            </label>

                            {{ form.department_code }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Department Head
                            </label>

                            {{ form.department_head }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Description
                            </label>

                            {{ form.description }}
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                Status
                            </label>

                            {{ form.status }}
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'department_list' %}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left-circle"></i>
                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-check-circle"></i>
                                Save Department

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
