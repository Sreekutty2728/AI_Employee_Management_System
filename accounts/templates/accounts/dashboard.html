<!DOCTYPE html>
<html>

<head>

<title>Employee Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}


.header{

    background:#1f4e79;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;

}


.container{

    padding:30px;

}


.cards{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

}


.card{

    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;

}


.card h3{

    color:#1f4e79;

}


</style>

</head>


<body>


<div class="header">

<h2>
Employee Portal
</h2>

<p>
Welcome Employee
</p>

</div>



<div class="container">


<h1>
Dashboard
</h1>


<div class="cards">


<div class="card">

<h3>
My Profile
</h3>

<p>
View personal details
</p>

</div>



<div class="card">

<h3>
Attendance
</h3>

<p>
95% Present
</p>

</div>



<div class="card">

<h3>
Leave Request
</h3>

<p>
Apply and track leave
</p>

</div>



<div class="card">

<h3>
Salary Details
</h3>

<p>
View payslip
</p>

</div>



<div class="card">

<h3>
My Tasks
</h3>

<p>
Check assigned tasks
</p>

</div>



<div class="card">

<h3>
Notifications
</h3>

<p>
Latest updates
</p>

</div>


</div>


</div>


</body>

</html>
