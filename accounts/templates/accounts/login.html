<!DOCTYPE html>
<html>
<head>

<title>Employee Management System - Login</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.login-box{

    width:380px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0px 10px 25px rgba(0,0,0,0.1);
}


h2{
    text-align:center;
    color:#1f4e79;
}

.message{
    background:#d1e7dd;
    color:#0f5132;
    border:1px solid #badbcc;
    border-radius:8px;
    padding:12px;
    margin:15px 0;
    text-align:center;
}


input{

    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;

}


button{

    width:100%;
    padding:12px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#163a5c;

}


.logo{

    text-align:center;
    font-size:40px;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🏢
</div>


<h2>
Employee Login
</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}
{% endif %}


<form method="POST">

{% csrf_token %}


<input type="text"
name="username"
placeholder="Username">


<input type="password"
name="password"
placeholder="Password">


<button type="submit">
Login
</button>


</form>


</div>


</body>
</html>
