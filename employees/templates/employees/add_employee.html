{% extends 'base.html' %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<style>

.employee-card{
    max-width:1100px;
    margin:40px auto;
    border:none;
    border-radius:18px;
    overflow:hidden;
}

.employee-header{
    background:linear-gradient(135deg,#0d6efd,#4f46e5);
    color:white;
    padding:25px;
}

.employee-header h2{
    margin:0;
    font-weight:bold;
}

.employee-body{
    padding:50px 60px;
    background:white;
}

.form-row{
    display:flex;
    align-items:center;
    margin-bottom:30px;
}

.form-label{
    width:240px;
    font-weight:600;
    font-size:17px;
    color:#333;
}

.form-control,
.form-select{
    height:52px;
    border-radius:10px;
    font-size:16px;
}

textarea.form-control{
    height:130px;
    resize:none;
}

.button-area{
    margin-top:45px;
    text-align:center;
}

.btn{
    min-width:170px;
    padding:12px;
    font-size:16px;
    border-radius:10px;
}

</style>

<div class="card shadow employee-card">

    <div class="employee-header">
        <h2>Add Employee</h2>
    </div>

    <div class="employee-body">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}
            <!-- Employee Photo -->
<div class="form-row">
    <label class="form-label">Employee Photo</label>

    <div class="flex-grow-1">
        <input
            type="file"
            name="profile_image"
            class="form-control"
            accept="image/*">

        <small class="text-muted">
            Upload a JPG, JPEG or PNG image
        </small>
    </div>
</div>

            <div class="form-row">
                <label class="form-label">Employee Name</label>

                <div class="flex-grow-1">
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter Employee Name">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Employee ID</label>

                <div class="flex-grow-1">
                    <input type="text"
                           name="employee_id"
                           class="form-control"
                           placeholder="EMP001">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Email Address</label>

                <div class="flex-grow-1">
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="employee@email.com">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Phone Number</label>

                <div class="flex-grow-1">
                    <input type="text"
                           name="phone"
                           class="form-control"
                           placeholder="9876543210">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Department</label>

                <div class="flex-grow-1">
                    <select class="form-select" name="department">
                        <option>Select Department</option>
                        <option>HR</option>
                        <option>Finance</option>
                        <option>Sales</option>
                        <option>Marketing</option>
                        <option>IT</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Designation</label>

                <div class="flex-grow-1">
                    <input type="text"
                           name="designation"
                           class="form-control"
                           placeholder="Software Engineer">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Salary</label>

                <div class="flex-grow-1">
                    <input type="number"
                           name="salary"
                           class="form-control"
                           placeholder="50000">
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">Joining Date</label>

                <div class="flex-grow-1">
                    <input type="date"
                           name="joining_date"
                           class="form-control">
                </div>
            </div>

            <div class="form-row" style="align-items:flex-start;">
                <label class="form-label mt-2">Address</label>

                <div class="flex-grow-1">
                    <textarea
                        name="address"
                        class="form-control"
                        placeholder="Enter Employee Address"></textarea>
                </div>
            </div>

            <div class="button-area">

                <button class="btn btn-success">
                    Save Employee
                </button>

                <a href="{% url 'employee_list' %}"
                   class="btn btn-secondary ms-3">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
