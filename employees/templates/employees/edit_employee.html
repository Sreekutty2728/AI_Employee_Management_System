<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }

        .container{
            width:600px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#333;
        }

        form p{
            margin-bottom:15px;
        }

        input, select, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .btn{
            background:#007bff;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .btn:hover{
            background:#0056b3;
        }

        .back{
            margin-left:15px;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Edit Employee</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Update Employee
        </button>

        <a href="{% url 'employee_list' %}" class="back">
            Back
        </a>

    </form>

</div>

</body>
</html>
